name: modules
title: "Summit Connect Hands-On-Lab: Containers on wheels"
version: master
nav:
  - modules/ROOT/nav.adoc

asciidoc:
  attributes:
    # Update this for every freshly provisioned workshop cluster. Every lab URL
    # is derived from it, so this one line repoints the whole lab.
    # Value below is the event cluster (sandbox1066). It stays up until
    # after the event.
    openshift_cluster_ingress_domain: apps.summit.sandbox1066.opentlc.com
    # Public upstream lab repository, offered on the wrap-up page for
    # working through the lab again after the event.
    lab_repo_url: https://github.com/shetze/sc-demo
    # Personal copy of the lab repository for every lab user (workshop-user01
    # ... workshop-user70). NN is replaced by the participant; left as a
    # placeholder on purpose, so that an unedited URL fails instead of
    # opening somebody else's repository.
    lab_user_repo_url: https://github.com/rhadp-workshop/workshop-userNN
    lab_name: "Summit Connect Hands-On-Lab: Containers on wheels"
    release-version: master
    page-pagination: true
    page-links:
    - url: https://redhat.com
      text: Red Hat
    - url: https://jumpstarter.dev
      text: Jumpstarter
