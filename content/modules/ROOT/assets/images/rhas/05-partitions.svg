<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Demo applications in the partitions of a RHIVOS image">
<title>Demo applications in the partitions of a RHIVOS image</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A6E73"/></marker></defs>
<rect width="900" height="390" fill="#FFFFFF"/>
<rect x="10" y="10" width="880" height="370" rx="10" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="30" y="36" font-family="'Red Hat Display','Red Hat Text','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#151515">RHIVOS image</text>
<rect x="30" y="52" width="270" height="220" rx="8" fill="#F2F2F2" stroke="#8A8D90" stroke-width="2"/>
<text x="165" y="78" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#151515">Root partition (ASIL)</text>
<text x="165" y="97" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">safety-relevant</text>
<rect x="65" y="120" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="2"/>
<text x="165" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">engine-service</text>
<text x="165" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="12" fill="#6A6E73">ipc_t</text>
<rect x="320" y="52" width="550" height="220" rx="8" fill="#F2F2F2" stroke="#8A8D90" stroke-width="2" stroke-dasharray="8 5"/>
<text x="595" y="78" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#151515">QM partition (container)</text>
<text x="595" y="97" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">quality-managed, isolated from the root partition</text>
<rect x="340" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="420" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">radio-service</text>
<text x="420" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_container_ipc_t</text>
<rect x="515" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="595" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">routingmanagerd</text>
<text x="595" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_container_ipc_t</text>
<rect x="690" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="770" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">dlt-daemon</text>
<text x="770" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_container_ipc_t</text>
<rect x="690" y="200" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2" stroke-dasharray="4 4"/>
<text x="770" y="223" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#151515">other QM processes</text>
<text x="770" y="242" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_t: no socket access</text>
<rect x="65" y="310" width="610" height="48" rx="8" fill="#E7F1FA" stroke="#0066CC" stroke-width="2"/>
<text x="370" y="331" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="13" font-weight="500" fill="#151515">/run/ipc/vsomeip</text>
<text x="370" y="349" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#151515">shared sockets for SOME/IP communication</text>
<line x1="165" y1="182" x2="165" y2="306" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="420" y1="182" x2="420" y2="306" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="595" y1="182" x2="595" y2="306" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="175" y="250" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">sends gear state</text>
<text x="430" y="250" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">receives gear state</text>
</svg>
